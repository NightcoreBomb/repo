# Сценарії ОС §7.2.1–7.2.5 і вартість перемикання контексту (збірка OSTEST=1)
# Згенеровано tools/lr4_gen_scenarios.py (SEED=4) — не редагувати вручну.
name: 'LR4 os'
version: 1
author: 'Paniushkin Vladyslav'

steps:
  - wait-serial: 'READY'
  - write-serial: "evt on\n"
  - write-serial: "telem 0\n"
  - delay: 500ms
  - write-serial: "os ctxsw\n"
  - wait-serial: 'CTXSW_COST'
  - write-serial: "os inv mutex\n"
  - wait-serial: 'INV kind=mutex'
  - write-serial: "os inv sem\n"
  - wait-serial: 'INV kind=binsem'
  - write-serial: "stats reset\n"
  - delay: 1000ms
  - write-serial: "os starve 300\n"
  - wait-serial: 'STARVE end'
  - write-serial: "note STARVE;\n"
  - wait-serial: 'NOTE STARVE;'
  - write-serial: "stats\n"
  - wait-serial: 'STAT END'
  - write-serial: "tasks\n"
  - wait-serial: 'TASKS END'
  - write-serial: "os qflood 50\n"
  - wait-serial: 'QFLOOD'
  - write-serial: "os heap\n"
  - wait-serial: 'HEAPX'
  - write-serial: "tasks\n"
  - wait-serial: 'TASKS END'
  - write-serial: "os overflow\n"
  - wait-serial: 'FATAL stack overflow'
  - delay: 300ms
