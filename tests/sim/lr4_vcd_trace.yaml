# Хронологія задач на аналізаторі: пін = задача виконується (`trace pins`)
# Згенеровано tools/lr4_gen_scenarios.py (SEED=4) — не редагувати вручну.
name: 'LR4 vcd_trace'
version: 1
author: 'Paniushkin Vladyslav'

steps:
  - wait-serial: 'READY'
  - write-serial: "evt on\n"
  - write-serial: "telem 0\n"
  - write-serial: "mode rec\n"
  - wait-serial: 'MODE REC'
  - set-control:
      part-id: imu
      control: accelX
      value: -0.0
  - set-control:
      part-id: imu
      control: accelZ
      value: 1.0
  - delay: 1000ms
  - set-control:
      part-id: imu
      control: accelX
      value: -0.142
  - set-control:
      part-id: imu
      control: accelZ
      value: 0.99
  - delay: 1000ms
  - set-control:
      part-id: imu
      control: accelX
      value: -0.267
  - set-control:
      part-id: imu
      control: accelZ
      value: 0.964
  - delay: 1000ms
  - write-serial: "mode live\n"
  - wait-serial: 'MODE LIVE'
  - write-serial: "trace pins\n"
  - wait-serial: 'OK trace'
  - write-serial: "mode rec\n"
  - wait-serial: 'MODE REC'
  - delay: 500ms
  - write-serial: "dump\n"
  - delay: 106ms
  - set-control:
      part-id: btn
      control: pressed
      value: 1
  - delay: 80ms
  - set-control:
      part-id: btn
      control: pressed
      value: 0
  - delay: 1500ms
  - write-serial: "calib\n"
  - delay: 300ms
  - set-control:
      part-id: btn
      control: pressed
      value: 1
  - delay: 80ms
  - set-control:
      part-id: btn
      control: pressed
      value: 0
  - delay: 1500ms
  - set-control:
      part-id: btn
      control: pressed
      value: 1
  - delay: 80ms
  - set-control:
      part-id: btn
      control: pressed
      value: 0
  - delay: 500ms
  - write-serial: "trace stop\n"
  - wait-serial: 'OK trace'
  - delay: 300ms
