# Automation scenario Wokwi: старт продукту (FR-12) + повний self-test усіх пристроїв (bring-up).
#   wokwi-cli --timeout 30000 --scenario tests/sim/selftest.test.yaml --serial-log-file build/serial.log .
#   python3 tools/parse_selftest.py build/serial.log
name: 'LR3 start checks + full self-test'
version: 1
author: 'Paniushkin Vladyslav'

steps:
  - wait-serial: 'CHK imu=OK who=0x68 oled=OK sd=OK type=SDHC adc=OK'
  - wait-serial: 'READY'
  - write-serial: "selftest\n"
  - wait-serial: 'ST BEGIN fw=LR3 board=NUCLEO-C031C6 sysclk=48000000'
  - wait-serial: 'ST END pass=6 fail=0'
  - write-serial: "status\n"
  - wait-serial: 'STATUS mode=LIVE'
